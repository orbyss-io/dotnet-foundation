name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    env:
      # Reused Windows MSBuild nodes retain loaded publisher-task DLLs between probes.
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Validate independent tool release boundaries
        run: python tests/validate_tool_release.py

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node for independent canonicalization vectors
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore locked dependency graph
        run: dotnet restore Orbyss.Foundation.slnx --locked-mode --configfile NuGet.config

      - name: Build Foundation
        run: dotnet build Orbyss.Foundation.slnx -c Release --no-restore

      - name: Validate Foundation contracts
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/validate_foundation.py --postgresql-deadline-only
          else
            python scripts/validate_foundation.py
          fi

      - name: Pack Foundation packages
        run: dotnet pack Orbyss.Foundation.slnx -c Release --no-build -p:FoundationRuntimeOnly=true --output artifacts/nuget

      - name: Verify native no-build Host metadata publication
        run: python tests/validate_host_settings_publish.py

      - name: Require the complete package family
        run: |
          python tests/validate_package_metadata.py --packages artifacts/nuget
          python tests/validate_settings_authentication_owner.py --packages artifacts/nuget
          python tests/validate_settings_owners.py --packages artifacts/nuget

      - name: Verify packaged public contracts through Host and PostgreSQL
        if: runner.os == 'Linux'
        run: python tests/run_contract_package_qualification.py

      - name: Verify packed OpenAPI exporter admission and evidence
        run: python tests/validate_openapi_exporter.py

      - name: Pack independently released Foundation tools
        run: |
          dotnet pack src/Orbyss.Foundation.Build/Orbyss.Foundation.Build.csproj -c Release --no-restore --output artifacts/tools
          dotnet pack src/Orbyss.Foundation.OpenApi.Exporter/Orbyss.Foundation.OpenApi.Exporter.csproj -c Release --no-restore --output artifacts/tools

      - name: Verify installed descriptor build package and legacy Assurance export
        run: |
          python scripts/validate_installed_tools.py --packages artifacts/tools
          python tests/validate_settings_owner.py

      - name: Verify packaged settings-only host consumption
        run: python scripts/validate_hosted_package_consumption.py --packages artifacts/nuget

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbyss-foundation-${{ github.sha }}-${{ runner.os }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-qualification-${{ github.sha }}-${{ runner.os }}
          path: |
            artifacts/**/*.log
            artifacts/**/result.json
            artifacts/**/results.json
            artifacts/**/inputs.json
            artifacts/**/observations.json
            artifacts/**/provenance.json
            artifacts/**/cancellation.json
            artifacts/**/descriptor-validation.json
          if-no-files-found: warn
