name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore locked dependency graph
        run: dotnet restore Orbyss.Foundation.slnx --locked-mode --configfile NuGet.config

      - name: Build Foundation
        run: dotnet build Orbyss.Foundation.slnx -c Release --no-restore

      - name: Validate Foundation contracts
        shell: bash
        run: |
          validators=(
            validate_analyzer.py
            validate_authentication_provider_boundary.py
            validate_bff_cookie_options.py
            validate_assurance.py
            validate_client_credentials.py
            validate_token_exchange.py
            validate_downstream_api.py
            validate_dpop.py
            validate_jwks_rotation.py
            validate_domain_events.py
            validate_keycloak_admin.py
          )
          for validator in "${validators[@]}"; do
            python "tests/$validator"
          done

      - name: Pack Foundation packages
        run: dotnet pack Orbyss.Foundation.slnx -c Release --no-build -p:PackageOutputPath="$PWD/artifacts/nuget"

      - name: Require the complete package family
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          [[ ${#packages[@]} -eq 22 ]] || { echo "Expected 22 Foundation packages, found ${#packages[@]}." >&2; exit 1; }
          python tests/validate_package_metadata.py --packages artifacts/nuget

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbyss-foundation-${{ github.sha }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
