name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate independent tool release boundaries
        run: python tests/validate_tool_release.py

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Node for independent canonicalization vectors
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Restore locked dependency graph
        run: dotnet restore Orbyss.Foundation.slnx --locked-mode --configfile NuGet.config

      - name: Build Foundation
        run: dotnet build Orbyss.Foundation.slnx -c Release --no-restore

      - name: Validate Foundation contracts
        run: python scripts/validate_foundation.py

      - name: Pack Foundation packages
        run: dotnet pack Orbyss.Foundation.slnx -c Release --no-build -p:FoundationRuntimeOnly=true --output artifacts/nuget

      - name: Require the complete package family
        run: python tests/validate_package_metadata.py --packages artifacts/nuget

      - name: Verify packed OpenAPI exporter admission and evidence
        run: python tests/validate_openapi_exporter.py

      - name: Pack independently released Foundation tools
        run: |
          dotnet pack src/Orbyss.Foundation.Build/Orbyss.Foundation.Build.csproj -c Release --no-restore --output artifacts/tools
          dotnet pack src/Orbyss.Foundation.OpenApi.Exporter/Orbyss.Foundation.OpenApi.Exporter.csproj -c Release --no-restore --output artifacts/tools

      - name: Verify installed descriptor build package and legacy Assurance export
        run: |
          python tests/validate_feature_build.py --package artifacts/tools/Orbyss.Foundation.Build.0.2.0.nupkg
          python tests/validate_settings_build.py --package artifacts/tools/Orbyss.Foundation.Build.0.2.0.nupkg
          python tests/validate_settings_owner.py
          python tests/validate_legacy_assurance_export.py --package artifacts/tools/Orbyss.Foundation.OpenApi.Exporter.0.2.4.nupkg

      - name: Verify packaged settings-only host consumption
        run: python scripts/validate_hosted_package_consumption.py --packages artifacts/nuget

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbyss-foundation-${{ github.sha }}-${{ runner.os }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
