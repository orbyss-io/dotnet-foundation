name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget-production
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Node for independent canonicalization vectors
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Verify release tag
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag must equal $expected" >&2; exit 1; }

      - name: Restore, build, and pack
        run: |
          dotnet restore Orbyss.Foundation.slnx --locked-mode --configfile NuGet.config
          dotnet build Orbyss.Foundation.slnx -c Release --no-restore
          dotnet pack Orbyss.Foundation.slnx -c Release --no-build -p:FoundationRuntimeOnly=true -p:PackageOutputPath="$PWD/artifacts/nuget"

      - name: Validate Foundation contracts before publication
        run: python scripts/validate_foundation.py

      - name: Capture the built portable Host for package and image qualification
        run: dotnet publish src/Orbyss.Foundation.Host/Orbyss.Foundation.Host.csproj -c Release --no-build --no-restore -p:UseAppHost=false -o artifacts/host-runtime

      - name: Validate package family
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          [[ ${#packages[@]} -eq 30 ]] || { echo "Expected 30 Foundation runtime packages, found ${#packages[@]}." >&2; exit 1; }
          for package in "${packages[@]}"; do
            [[ "$(basename "$package")" == Orbyss.Foundation.* ]] || { echo "Unexpected package: $package" >&2; exit 1; }
          done
          python tests/validate_package_metadata.py --packages artifacts/nuget
          python tests/validate_settings_owner.py

      - name: Verify packaged settings-only host consumption
        run: python scripts/validate_hosted_package_consumption.py --packages artifacts/nuget --host artifacts/host-runtime/Orbyss.Foundation.Host.dll

      - name: Verify packed OpenAPI exporter admission and evidence
        run: python tests/validate_openapi_exporter.py

      - name: Verify packaged public contracts through Host and PostgreSQL
        run: python tests/run_contract_package_qualification.py --host artifacts/host-runtime/Orbyss.Foundation.Host.dll

      - name: Verify the exact qualified image payload
        run: python tests/validate_host_release_payload.py --payload artifacts/host-runtime --qualification-root artifacts/contract-package-consumption

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build both Host image platforms before publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: artifacts/host-runtime
          file: src/Orbyss.Foundation.Host/Dockerfile.qualified
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-release-qualification-${{ github.sha }}
          path: |
            artifacts/**/*.log
            artifacts/**/result.json
            artifacts/**/results.json
            artifacts/**/inputs.json
            artifacts/**/observations.json
            artifacts/**/provenance.json
            artifacts/**/cancellation.json
            artifacts/**/descriptor-validation.json
          if-no-files-found: warn

      - name: Attest validated packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/nuget/*.nupkg

      - name: Authenticate with NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Verify public NuGet propagation
        run: python scripts/verify_nuget_publication.py --packages artifacts/nuget --timeout-seconds 900

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Foundation host
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: artifacts/host-runtime
          file: src/Orbyss.Foundation.Host/Dockerfile.qualified
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          tags: |
            ghcr.io/orbyss-io/foundation-host:${{ github.ref_name }}
            ghcr.io/orbyss-io/foundation-host:latest
