name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget-production
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node for independent canonicalization vectors
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Verify release tag
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag must equal $expected" >&2; exit 1; }

      - name: Restore, build, and pack
        run: |
          dotnet restore Orbyss.Foundation.slnx --locked-mode --configfile NuGet.config
          dotnet build Orbyss.Foundation.slnx -c Release --no-restore
          dotnet pack Orbyss.Foundation.slnx -c Release --no-build -p:FoundationRuntimeOnly=true -p:PackageOutputPath="$PWD/artifacts/nuget"

      - name: Validate Foundation contracts before publication
        run: python scripts/validate_foundation.py

      - name: Verify installed response-policy and BFF candidate packages
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python tests/validate_web_policies.py --package "artifacts/nuget/Orbyss.Foundation.WebDefaults.$version.nupkg" --bff-package "artifacts/nuget/Orbyss.Foundation.Authentication.BffCookie.$version.nupkg"

      - name: Capture the built portable Host for package and image qualification
        run: dotnet publish src/Orbyss.Foundation.Host/Orbyss.Foundation.Host.csproj -c Release --no-build --no-restore -p:UseAppHost=false -o artifacts/host-runtime

      - name: Verify native no-build Host metadata publication
        run: python tests/validate_host_settings_publish.py

      - name: Validate package family
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          [[ ${#packages[@]} -eq 30 ]] || { echo "Expected 30 Foundation runtime packages, found ${#packages[@]}." >&2; exit 1; }
          for package in "${packages[@]}"; do
            [[ "$(basename "$package")" == Orbyss.Foundation.* ]] || { echo "Unexpected package: $package" >&2; exit 1; }
          done
          python tests/validate_package_metadata.py --packages artifacts/nuget
          python tests/validate_settings_owner.py
          python tests/validate_settings_authentication_owner.py --packages artifacts/nuget
          python tests/validate_settings_owners.py --packages artifacts/nuget

      - name: Export exact publisher capability and settings knowledge
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/build_release_knowledge.py --packages artifacts/nuget --version "$(tr -d '\r\n' < VERSION)" --source-commit "$SOURCE_COMMIT" --output artifacts/foundation-knowledge-candidate.json

      - name: Verify packaged settings-only host consumption
        run: python scripts/validate_hosted_package_consumption.py --packages artifacts/nuget --host artifacts/host-runtime/Orbyss.Foundation.Host.dll

      - name: Verify packed OpenAPI exporter admission and evidence
        run: python tests/validate_openapi_exporter.py

      - name: Verify packaged public contracts through Host and PostgreSQL
        run: python tests/run_contract_package_qualification.py --host artifacts/host-runtime/Orbyss.Foundation.Host.dll

      - name: Verify the exact qualified image payload
        run: python tests/validate_host_release_payload.py --payload artifacts/host-runtime --qualification-root artifacts/contract-package-consumption

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build both Host image platforms before publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: artifacts/host-runtime
          file: src/Orbyss.Foundation.Host/Dockerfile.qualified
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=artifacts/host-candidate.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up pinned vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - name: Scan both exact candidate image platforms before any publication
        run: python scripts/dependency_maintenance.py scan --image artifacts/host-candidate.tar

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-release-qualification-${{ github.sha }}
          path: |
            artifacts/**/*.log
            artifacts/**/result.json
            artifacts/**/results.json
            artifacts/**/inputs.json
            artifacts/**/observations.json
            artifacts/**/provenance.json
            artifacts/**/cancellation.json
            artifacts/**/descriptor-validation.json
            artifacts/dependency-security/*.json
          if-no-files-found: warn

      - name: Attest validated packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/nuget/*.nupkg

      - name: Authenticate with NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Verify public NuGet propagation
        run: python scripts/verify_nuget_publication.py --packages artifacts/nuget --timeout-seconds 900

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Foundation host
        id: host-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: artifacts/host-runtime
          file: src/Orbyss.Foundation.Host/Dockerfile.qualified
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          tags: |
            ghcr.io/orbyss-io/foundation-host:${{ github.ref_name }}
            ghcr.io/orbyss-io/foundation-host:latest

      - name: Publish exact release knowledge after package and image publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          HOST_DIGEST: ${{ steps.host-image.outputs.digest }}
        run: |
          python scripts/build_release_knowledge.py --packages artifacts/nuget --version "$(tr -d '\r\n' < VERSION)" --source-commit "$SOURCE_COMMIT" --host artifacts/host-runtime --host-image "ghcr.io/orbyss-io/foundation-host@$HOST_DIGEST" --output artifacts/foundation-knowledge.json
          gh release create "$GITHUB_REF_NAME" artifacts/foundation-knowledge.json --verify-tag --title "Foundation $GITHUB_REF_NAME" --notes "Qualified runtime, immutable Host image and versioned publisher capability/settings/interface knowledge."
