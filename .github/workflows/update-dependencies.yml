name: Update dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: dependency-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Upgrade active external pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dependency_maintenance.py upgrade
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Refresh metadata and run all deterministic tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_dependencies.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build both candidate image platforms
        run: |
          host=$(python -c 'import json; print(json.load(open("artifacts/dependency-update-payload.json"))["host"])')
          docker buildx build --platform linux/amd64,linux/arm64 --output type=oci,dest=artifacts/host-candidate.tar -f src/Orbyss.Foundation.Host/Dockerfile.qualified "$host"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.75.0
      - name: Scan candidate images
        run: python scripts/dependency_maintenance.py scan --image artifacts/host-candidate.tar
      - name: Prepare the tested update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then exit 0; fi
          branch="codex/dependencies-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update external dependencies and regenerated publisher metadata"
          git push origin "$branch"
          gh pr create --title "Update external dependencies" --body "Upgraded active tooling and packages, refreshed native publisher metadata, passed all deterministic checks, and scanned both candidate image platforms. See this workflow's preserved evidence."
      - name: Preserve update evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-update-${{ github.run_id }}
          path: |
            artifacts/dependency-update*.json
            artifacts/dependency-update-tests/
            artifacts/dependency-security/
